<!doctype html>
<!-- build: screencap-paste-v1 -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f6f5e"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🥫%3C/text%3E%3C/svg%3E">
<title>ตารางคู่แข่ง กระป๋องกระดาษ</title>
<style>
:root{--g:#2f6f5e;--g2:#e6f2ee;--bd:#d9dfdc;--tx:#1d2723;--mu:#68756f;--bg:#f5f7f6;--rd:#c0392b;--am:#b7791f;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:#fff}
textarea{min-height:70px;resize:vertical}
button{cursor:pointer;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 12px;min-height:38px}
button.p{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
button.d{color:var(--rd);border-color:#e7c3be}
button:disabled{opacity:.5}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
header h1{font-size:17px;margin:0;font-weight:700}
header button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35);min-height:34px;padding:5px 10px}
header button.add{background:#fff;color:var(--g);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:transparent;border:0;color:#d7ebe4;border-radius:10px 10px 0 0;padding:9px 13px;min-height:40px}
.tab.on{background:var(--bg);color:var(--g);font-weight:700}
main{max-width:1200px;margin:0 auto;padding:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters .full{grid-column:1/-1}
@media(min-width:760px){.filters{grid-template-columns:repeat(5,1fr)}.filters .full{grid-column:auto}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px}
.stat .l{color:var(--mu);font-size:12.5px}.stat .v{font-size:22px;font-weight:700;color:var(--g)}.stat .s{font-size:12px;color:var(--mu)}
.gt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:6px;font-size:14px}
.gt th,.gt td{padding:7px 9px;text-align:right;border-bottom:1px solid #edf0ee}.gt th:first-child,.gt td:first-child{text-align:left}
.gt th{background:var(--g2);font-weight:600}
.note{color:var(--mu);font-size:12.5px;margin:0 0 12px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px;display:flex;gap:10px}
.card.unr{border-color:#ecd9a8;background:#fffaf0}
.th{width:84px;height:84px;flex:none;border-radius:10px;background:#eef2f0;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;position:relative;overflow:hidden;border:1px solid var(--bd);padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;font-size:11px;padding:0 6px;font-weight:500}
.cb{flex:1;min-width:0}
.cb .t{font-weight:700;overflow-wrap:anywhere}
.pill{display:inline-block;border-radius:20px;padding:1px 8px;font-size:12px;background:var(--g2);color:var(--g);margin:2px 3px 2px 0;white-space:nowrap}
.pill.m{background:#e3ecf8;color:#2b5aa0}.pill.pa{background:#fbeede;color:#9a5b12}.pill.n{background:#eee;color:#555}.pill.w{background:#fdecc8;color:#8a5a00}
.pp{font-size:20px;font-weight:700;color:var(--g)}.pp small{font-size:12px;font-weight:400;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.acts button{min-height:34px;padding:4px 10px;font-size:14px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;min-width:1000px;font-size:14px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid #edf0ee;text-align:left;vertical-align:top}
table.t th{background:var(--g2);position:sticky;top:0;white-space:nowrap}
table.t td.r{text-align:right;white-space:nowrap}
table.t tr.unr td{background:#fffaf0}
table.t .th{width:44px;height:44px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 10px;font-size:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fg .full{grid-column:1/-1}
.fg label{font-size:12.5px;color:var(--mu);display:block;margin-bottom:2px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.im{position:relative;width:84px;height:84px}
.im .th{width:84px;height:84px}
.im .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--rd);color:#fff;border:2px solid #fff;padding:0;min-height:0;line-height:1;font-size:15px}
.im.q{opacity:.65}
.sticky{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));background:#fff;padding:10px 0 4px;display:flex;gap:8px;margin-top:10px;border-top:1px solid #eee}
.sticky button{flex:1}
.pv{background:var(--g2);border-radius:9px;padding:8px 10px;font-weight:700;color:var(--g)}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:22px;min-width:46px;min-height:46px;border-radius:50%}
.lb .c{top:calc(10px + env(safe-area-inset-top));right:10px}.lb .pv2{left:8px;top:50%}.lb .nx{right:8px;top:50%}
.lb .cap{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));color:#fff;font-size:13px;left:0;right:0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:99;font-size:14px;max-width:90vw}
.login{max-width:360px;margin:18vh auto 0;padding:20px;background:#fff;border:1px solid var(--bd);border-radius:16px}
.login h1{font-size:19px;margin:0 0 4px}.login p{color:var(--mu);margin:0 0 12px}
.err{color:var(--rd);font-size:13.5px;margin-top:8px;min-height:18px}
.menu{position:absolute;right:12px;top:48px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:30;min-width:210px;overflow:hidden}
.menu button{display:block;width:100%;border:0;border-radius:0;text-align:left;background:#fff;color:var(--tx);border-bottom:1px solid #eee;padding:11px 14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const API="https://jmgagxytzkeewenchzyo.supabase.co/functions/v1/can-tracker-api";
const IMG="https://jmgagxytzkeewenchzyo.supabase.co/storage/v1/object/public/can-images/";
const LID={metal:"ฝาเหล็ก",paper:"ฝากระดาษ",none:"ไม่มีฝา",unknown:"ไม่ทราบฝา"};
const TABS=[["metal","ฝาเหล็ก"],["paper","ฝากระดาษ"],["other","ไม่มีฝา/ไม่ทราบ"],["all","ทั้งหมด"]];
const groupOf=r=>r.lid_type==="metal"?"metal":r.lid_type==="paper"?"paper":"other";
const S={pass:localStorage.getItem("ct_pass")||"",rows:[],tab:localStorage.getItem("ct_tab")||"metal",pf:"",shop:"",q:"",sort:"pp_asc",view:localStorage.getItem("ct_view")||(innerWidth>=900?"table":"cards"),edit:null,menu:false,loading:false,err:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pp=r=>(r.pack_price==null||!(r.pack_count>0))?null:Number(r.pack_price)/Number(r.pack_count);
const baht=v=>v==null?"–":"฿"+v.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>v==null?"–":Number(v).toLocaleString("th-TH",{maximumFractionDigits:2});
const soldNum=t=>{const m=/^([\d.,]+)(k?)/i.exec(t||"");if(!m)return -1;let n=parseFloat(m[1].replace(/,/g,""));return m[2]?n*1000:n};
const imgUrl=p=>IMG+p.split("/").map(encodeURIComponent).join("/");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

async function api(action,data={}){
  let res;
  try{res=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-region":"ap-southeast-1"},body:JSON.stringify({action,passcode:S.pass,...data})})}
  catch(e){throw new Error("เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต")}
  let j={};try{j=await res.json()}catch(e){}
  if(res.status===401&&action!=="login"){logout(true);throw new Error("รหัสผ่านไม่ถูกต้อง")}
  if(!res.ok)throw new Error(j.error||("ผิดพลาด "+res.status));
  return j;
}
function logout(keepMsg){localStorage.removeItem("ct_pass");S.pass="";S.rows=[];S.err=keepMsg?"กรุณาใส่รหัสผ่านอีกครั้ง":"";render()}
async function load(){S.loading=true;render();try{S.rows=(await api("list")).rows}catch(e){S.err=e.message}S.loading=false;render()}

/* ---------- filtering ---------- */
function baseRows(){ // platform/shop/search filters, no tab
  const q=S.q.trim().toLowerCase();
  return S.rows.filter(r=>(!S.pf||r.platform===S.pf)&&(!S.shop||r.shop===S.shop)&&(!q||[r.shop,r.platform,r.colour,r.notes,r.diameter,r.item_ref,r.lid_note].join(" ").toLowerCase().includes(q)));
}
function sortRows(a){
  const k=S.sort,n=(x,d)=>x==null?d:x;
  const cmp={pp_asc:(x,y)=>n(pp(x),1e12)-n(pp(y),1e12),pp_desc:(x,y)=>n(pp(y),-1)-n(pp(x),-1),shop:(x,y)=>(x.shop+x.platform).localeCompare(y.shop+y.platform,"th"),len:(x,y)=>n(x.length_cm,1e9)-n(y.length_cm,1e9),sold:(x,y)=>soldNum(y.sold_text)-soldNum(x.sold_text),new:(x,y)=>(y.updated_at||"").localeCompare(x.updated_at||"")}[k];
  return a.slice().sort(cmp);
}
function stats(rows){
  const ok=rows.filter(r=>!r.unreliable&&pp(r)!=null).map(r=>({r,v:pp(r)}));
  const vs=ok.map(o=>o.v).sort((a,b)=>a-b);
  const med=vs.length?(vs.length%2?vs[(vs.length-1)/2]:(vs[vs.length/2-1]+vs[vs.length/2])/2):null;
  const mn=ok.reduce((m,o)=>!m||o.v<m.v?o:m,null),mx=ok.reduce((m,o)=>!m||o.v>m.v?o:m,null);
  return {n:rows.length,counted:ok.length,excl:rows.length-ok.length,min:mn,max:mx,med};
}

/* ---------- render ---------- */
function render(){
  const el=$("#app");
  if(!S.pass){el.innerHTML=`<form class="login" id="lf"><h1>ตารางคู่แข่ง กระป๋องกระดาษ</h1><p>ใส่รหัสผ่านเพื่อเข้าใช้งาน</p><input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" autofocus><div class="err">${esc(S.err)}</div><button class="p" style="width:100%;margin-top:6px" id="lb">เข้าสู่ระบบ</button></form>`;
    $("#lf").onsubmit=async e=>{e.preventDefault();const b=$("#lb");b.disabled=true;S.pass=$("#pw").value.trim();try{await api("login");localStorage.setItem("ct_pass",S.pass);S.err="";await load()}catch(x){S.pass="";S.err=x.message;render()}};return}
  const base=baseRows();
  const cnt={all:base.length};for(const t of["metal","paper","other"])cnt[t]=base.filter(r=>groupOf(r)===t).length;
  const rows=sortRows(S.tab==="all"?base:base.filter(r=>groupOf(r)===S.tab));
  const st=stats(rows);
  const pfs=[...new Set(S.rows.map(r=>r.platform).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th"));
  const shops=[...new Set(S.rows.filter(r=>!S.pf||r.platform===S.pf).map(r=>r.shop).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"th"));
  const opt=(arr,sel,all)=>`<option value="">${all}</option>`+arr.map(x=>`<option${x===sel?" selected":""} value="${esc(x)}">${esc(x)}</option>`).join("");
  const grp=["metal","paper","other"].map(g=>{const s=stats(base.filter(r=>groupOf(r)===g));return `<tr><td>${{metal:"ฝาเหล็ก",paper:"ฝากระดาษ",other:"ไม่มีฝา/ไม่ทราบ"}[g]}</td><td>${s.n}</td><td>${s.min?baht(s.min.v):"–"}</td><td>${s.max?baht(s.max.v):"–"}</td><td>${baht(s.med)}</td></tr>`}).join("");
  el.innerHTML=`
  <header>
    <div class="hrow"><h1>🥫 คู่แข่ง กระป๋องกระดาษ</h1><div style="display:flex;gap:6px"><button class="add" id="add">＋ เพิ่ม</button><button id="mn">⋯</button></div></div>
    ${S.menu?`<div class="menu"><button data-m="csvv">⬇ ส่งออก CSV (ที่แสดงอยู่)</button><button data-m="csva">⬇ ส่งออก CSV (ทั้งหมด)</button><button data-m="view">${S.view==="cards"?"แสดงแบบตาราง":"แสดงแบบการ์ด"}</button><button data-m="reload">โหลดข้อมูลใหม่</button><button data-m="out">ออกจากระบบ</button></div>`:""}
    <div class="tabs">${TABS.map(([k,l])=>`<button class="tab${S.tab===k?" on":""}" data-tab="${k}">${l} (${cnt[k]})</button>`).join("")}</div>
  </header>
  <main>
    <div class="filters">
      <select id="fpf">${opt(pfs,S.pf,"ทุกแพลตฟอร์ม")}</select>
      <select id="fshop">${opt(shops,S.shop,"ทุกร้าน")}</select>
      <select id="fsort"><option value="pp_asc">ราคาต่อชิ้น ต่ำ→สูง</option><option value="pp_desc">ราคาต่อชิ้น สูง→ต่ำ</option><option value="sold">ขายแล้วมาก→น้อย</option><option value="len">ความยาว สั้น→ยาว</option><option value="shop">ชื่อร้าน ก→ฮ</option><option value="new">แก้ไขล่าสุด</option></select>
      <input id="fq" class="full" type="search" placeholder="ค้นหา ร้าน/สี/หมายเหตุ" value="${esc(S.q)}">
    </div>
    ${S.err?`<div class="err">${esc(S.err)}</div>`:""}
    ${S.loading?'<div class="empty">กำลังโหลด…</div>':`
    <div class="stats">
      <div class="stat"><div class="l">ถูกสุด / ชิ้น</div><div class="v">${st.min?baht(st.min.v):"–"}</div><div class="s">${st.min?esc(st.min.r.shop):""}</div></div>
      <div class="stat"><div class="l">แพงสุด / ชิ้น</div><div class="v">${st.max?baht(st.max.v):"–"}</div><div class="s">${st.max?esc(st.max.r.shop):""}</div></div>
      <div class="stat"><div class="l">ค่ากลาง / ชิ้น</div><div class="v">${baht(st.med)}</div><div class="s">จาก ${st.counted} SKU</div></div>
      <div class="stat"><div class="l">จำนวน SKU ที่แสดง</div><div class="v">${st.n}</div><div class="s">${st.excl?`ไม่นับในสถิติ ${st.excl} (ราคาไม่น่าเชื่อถือ/ไม่มีราคา)`:"นับครบทุกแถว"}</div></div>
    </div>
    <table class="gt"><tr><th>สรุปตามกลุ่ม (ตามตัวกรอง)</th><th>SKU</th><th>ถูกสุด</th><th>แพงสุด</th><th>ค่ากลาง</th></tr>${grp}</table>
    <p class="note">ราคาต่อชิ้น = ราคา/แพ็ค ÷ จำนวนชิ้น/แพ็ค · แถวที่ติดธง ⚠ (ราคาอาจเป็นต่อแพ็ค) ไม่นับในสถิติ</p>
    ${rows.length?(S.view==="cards"?`<div class="cards">${rows.map(card).join("")}</div>`:table(rows)):'<div class="empty">ไม่พบข้อมูล · กด “＋ เพิ่ม” เพื่อเพิ่มแถวใหม่</div>'}`}
  </main>`;
  $("#fsort").value=S.sort;
  $("#add").onclick=()=>openEdit(null);
  $("#mn").onclick=()=>{S.menu=!S.menu;render()};
  document.querySelectorAll(".menu button").forEach(b=>b.onclick=()=>menu(b.dataset.m));
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;localStorage.setItem("ct_tab",S.tab);render()});
  $("#fpf").onchange=e=>{S.pf=e.target.value;S.shop="";render()};
  $("#fshop").onchange=e=>{S.shop=e.target.value;render()};
  $("#fsort").onchange=e=>{S.sort=e.target.value;render()};
  $("#fq").oninput=e=>{S.q=e.target.value;clearTimeout(S._t);S._t=setTimeout(()=>{render();const q=$("#fq");q.focus();q.setSelectionRange(q.value.length,q.value.length)},350)};
  el.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id,a=b.dataset.act;const r=S.rows.find(x=>x.id===id);if(!r)return;
    if(a==="edit")openEdit(r);else if(a==="dup")openEdit({...r,id:null,images:[]});else if(a==="del")delRow(r);else if(a==="img")lightbox(r.images.map(imgUrl),0,r.shop)});
}
function meta(r){
  const t=[];
  if(r.diameter)t.push("⌀ "+esc(r.diameter));
  if(r.length_cm!=null)t.push("สูง "+nf(r.length_cm)+" cm");
  t.push("หนา "+(r.thickness_mm!=null?nf(r.thickness_mm)+" mm":"?"));
  return t.join(" · ");
}
function lidPill(r){const c={metal:"m",paper:"pa",none:"n",unknown:"n"}[r.lid_type];return `<span class="pill ${c}">${LID[r.lid_type]}</span>`}
function thumb(r){return r.images&&r.images.length?`<button class="th" data-act="img" data-id="${r.id}"><img loading="lazy" src="${imgUrl(r.images[0])}" alt=""><b>${r.images.length>1?"🖼 "+r.images.length:"🔍"}</b></button>`:`<div class="th">ไม่มีรูป</div>`}
function rv(r){const a=[];if(r.sold_text)a.push("ขายแล้ว "+esc(r.sold_text));if(r.rating!=null)a.push("★ "+nf(r.rating)+(r.review_count!=null?" ("+r.review_count+")":""));return a.join(" · ")}
function card(r){
  const v=pp(r);
  return `<div class="card${r.unreliable?" unr":""}">${thumb(r)}<div class="cb">
    <div class="t">${esc(r.shop||"(ไม่ระบุร้าน)")}</div>
    <div><span class="pill">${esc(r.platform||"-")}</span>${lidPill(r)}${r.unreliable?'<span class="pill w">⚠ ราคาอาจเป็นต่อแพ็ค</span>':""}</div>
    <div class="mu">${meta(r)}${r.colour?" · สี "+esc(r.colour):""}</div>
    <div><span class="pp">${baht(v)} <small>/ ชิ้น</small></span></div>
    <div class="mu">${r.pack_price!=null?"฿"+nf(r.pack_price)+" / แพ็ค "+nf(r.pack_count)+" ชิ้น":"ยังไม่มีราคา"}${r.lid_note?" · "+esc(r.lid_note):""}</div>
    ${rv(r)?`<div class="mu">${rv(r)}</div>`:""}
    ${r.notes?`<div class="mu" style="max-height:3.1em;overflow:hidden">${esc(r.notes)}</div>`:""}
    <div class="acts"><button data-act="edit" data-id="${r.id}">แก้ไข</button><button data-act="dup" data-id="${r.id}">คัดลอก</button><button class="d" data-act="del" data-id="${r.id}">ลบ</button>${r.link?`<a href="${esc(/^https?:/.test(r.link)?r.link:"#")}" target="_blank" rel="noopener"><button>ลิงก์</button></a>`:""}</div>
  </div></div>`;
}
function table(rows){
  return `<div class="tw"><table class="t"><tr><th>รูป</th><th>แพลตฟอร์ม</th><th>ร้าน</th><th>⌀ นิ้ว</th><th>ยาว cm</th><th>หนา mm</th><th>สี</th><th>ฝา</th><th>ชิ้น/แพ็ค</th><th>ราคา/แพ็ค</th><th>ราคา/ชิ้น</th><th>ขายแล้ว</th><th>รีวิว</th><th>หมายเหตุ</th><th></th></tr>
  ${rows.map(r=>`<tr class="${r.unreliable?"unr":""}"><td>${thumb(r)}</td><td>${esc(r.platform)}</td><td>${esc(r.shop)}${r.unreliable?" ⚠":""}</td><td>${esc(r.diameter)}</td><td class="r">${nf(r.length_cm)}</td><td class="r">${r.thickness_mm!=null?nf(r.thickness_mm):"?"}</td><td>${esc(r.colour)}</td><td>${lidPill(r)}<div class="mu">${esc(r.lid_note)}</div></td><td class="r">${nf(r.pack_count)}</td><td class="r">${nf(r.pack_price)}</td><td class="r"><b>${baht(pp(r))}</b></td><td>${esc(r.sold_text)}</td><td>${r.rating!=null?"★ "+nf(r.rating)+(r.review_count!=null?" ("+r.review_count+")":""):""}</td><td style="min-width:200px;max-width:300px">${esc(r.notes)}</td><td style="white-space:nowrap"><button data-act="edit" data-id="${r.id}">แก้ไข</button> <button data-act="dup" data-id="${r.id}">คัดลอก</button> <button class="d" data-act="del" data-id="${r.id}">ลบ</button></td></tr>`).join("")}</table></div>`;
}

/* ---------- menu / csv ---------- */
function menu(m){
  S.menu=false;
  if(m==="view"){S.view=S.view==="cards"?"table":"cards";localStorage.setItem("ct_view",S.view);render()}
  else if(m==="reload")load();else if(m==="out")logout();
  else{const base=baseRows(),rows=m==="csva"?sortRows(S.rows):sortRows(S.tab==="all"?base:base.filter(r=>groupOf(r)===S.tab));csv(rows,m==="csva"?"ทั้งหมด":"ที่แสดง");render()}
}
function csv(rows,tag){
  const H=["แพลตฟอร์ม","ร้าน","ขนาด (นิ้ว)","ความยาว (cm)","ความหนา (mm)","สี","ชนิดฝา","รายละเอียดฝา","จำนวน/แพ็ค","ราคา/แพ็ค","ราคาต่อชิ้น","ที่มาราคา","ขายแล้ว","คะแนน","จำนวนรีวิว","ราคาไม่น่าเชื่อถือ","หมายเหตุ","ลิงก์","รูป"];
  const q=v=>{v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[H.map(q).join(",")].concat(rows.map(r=>[r.platform,r.shop,r.diameter,r.length_cm,r.thickness_mm,r.colour,LID[r.lid_type],r.lid_note,r.pack_count,r.pack_price,pp(r)==null?"":pp(r).toFixed(2),r.price_basis,r.sold_text,r.rating,r.review_count,r.unreliable?"ใช่":"",r.notes,r.link,(r.images||[]).map(imgUrl).join(" ")].map(q).join(",")));
  const b=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="can-competitors-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("ส่งออก "+rows.length+" แถว ("+tag+")");
}

/* ---------- edit sheet ---------- */
const FIELDS=["platform","shop","item_ref","diameter","length_cm","thickness_mm","colour","lid_type","lid_note","pack_count","pack_price","price_basis","sold_text","rating","review_count","link","notes","unreliable"];
function openEdit(r){
  const isNew=!r||!r.id;
  S.edit={isNew,row:r?{...r}:{platform:S.pf||"",lid_type:S.tab==="paper"?"paper":S.tab==="metal"?"metal":"unknown",pack_count:1,images:[]},queue:[]};
  const e=S.edit,row=e.row;
  const pfs=[...new Set(S.rows.map(x=>x.platform).filter(Boolean))];
  const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  const v=k=>esc(row[k]==null?"":row[k]);
  ov.innerHTML=`<div class="sheet"><h2>${isNew?(r?"คัดลอกเป็นแถวใหม่":"เพิ่มแถวใหม่"):"แก้ไขแถว"}</h2>
  <div class="fg">
   <div><label>แพลตฟอร์ม</label><input name="platform" list="dlpf" value="${v("platform")}" placeholder="Shopee / TikTok Shop / Lazada…"><datalist id="dlpf">${pfs.concat(["ขายส่ง/เว็บไซต์ร้าน"]).filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
   <div><label>ร้าน</label><input name="shop" value="${v("shop")}"></div>
   <div><label>ขนาดกระป๋อง (นิ้ว) เช่น 4"</label><input name="diameter" value="${v("diameter")}"></div>
   <div><label>ความยาว (cm)</label><input name="length_cm" inputmode="decimal" value="${v("length_cm")}"></div>
   <div><label>ความหนา (mm)</label><input name="thickness_mm" inputmode="decimal" value="${v("thickness_mm")}" placeholder="ว่าง = ไม่ทราบ"></div>
   <div><label>สีกระป๋อง</label><input name="colour" value="${v("colour")}"></div>
   <div><label>ชนิดฝา</label><select name="lid_type">${Object.entries(LID).map(([k,l])=>`<option value="${k}"${row.lid_type===k?" selected":""}>${l}</option>`).join("")}</select></div>
   <div><label>รายละเอียดฝา</label><input name="lid_note" value="${v("lid_note")}" placeholder="เช่น ฝาเรียบ ซีลก้น"></div>
   <div><label>จำนวนชิ้น / แพ็ค</label><input name="pack_count" inputmode="decimal" value="${v("pack_count")}"></div>
   <div><label>ราคา / แพ็ค (บาท)</label><input name="pack_price" inputmode="decimal" value="${v("pack_price")}"></div>
   <div class="full pv" id="pv"></div>
   <div><label>ที่มาของราคา</label><input name="price_basis" value="${v("price_basis")}" placeholder="หน้าเว็บ / คำอธิบาย / โปรโมชัน"></div>
   <div><label>ขายแล้ว</label><input name="sold_text" value="${v("sold_text")}" placeholder="เช่น 8k+ หรือ 144"></div>
   <div><label>คะแนนรีวิว</label><input name="rating" inputmode="decimal" value="${v("rating")}"></div>
   <div><label>จำนวนรีวิว</label><input name="review_count" inputmode="numeric" value="${v("review_count")}"></div>
   <div class="full"><label>ลิงก์สินค้า</label><input name="link" type="url" inputmode="url" value="${v("link")}" placeholder="https://"></div>
   <div class="full"><label>หมายเหตุ</label><textarea name="notes">${v("notes")}</textarea></div>
   <div class="full chk"><input type="checkbox" name="unreliable"${row.unreliable?" checked":""}><span>⚠ ราคาไม่น่าเชื่อถือ / อาจเป็นราคาต่อแพ็ค (ไม่นับในสถิติสูงสุด-ต่ำสุด)</span></div>
   <div class="full"><label>รูปภาพ</label><div class="imgs" id="imgs"></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="cam">📷 ถ่ายรูป</button><button type="button" id="gal">🖼 เลือกรูปจากเครื่อง</button><button type="button" id="scr">🖥 แคปหน้าจอ</button></div>
     <div class="mu" id="pastehint">วางรูปด้วย Ctrl+V ได้ หรือลากรูปมาวางในหน้านี้ · <span id="scrhint"></span></div>
     <input type="file" id="fcam" accept="image/*" capture="environment" class="hide"><input type="file" id="fgal" accept="image/*" multiple class="hide">
     <div class="mu" id="imnote">${isNew?"รูปจะถูกอัปโหลดเมื่อกดบันทึก":""}</div></div>
  </div>
  <div class="sticky"><button type="button" id="cancel">ยกเลิก</button><button type="button" class="p" id="save">บันทึก</button></div></div>`;
  document.body.appendChild(ov);
  document.body.style.overflow="hidden";
  const get=n=>ov.querySelector(`[name=${n}]`);
  const upd=()=>{const p=parseFloat(get("pack_price").value),c=parseFloat(get("pack_count").value);ov.querySelector("#pv").textContent="ราคาต่อชิ้น: "+(p>=0&&c>0?baht(p/c):"–")};
  ["pack_price","pack_count"].forEach(n=>get(n).oninput=upd);upd();
  const close=()=>{ov.remove();document.removeEventListener("paste",onPaste);document.body.style.overflow="";S.edit=null};
  ov.querySelector("#cancel").onclick=close;
  ov.onclick=ev=>{if(ev.target===ov&&!ov.querySelector("#save").disabled&&confirm("ปิดโดยไม่บันทึก?"))close()};
  const drawImgs=()=>{
    const box=ov.querySelector("#imgs");box.innerHTML="";
    row.images.forEach((p,i)=>{const d=document.createElement("div");d.className="im";d.innerHTML=`<button type="button" class="th"><img src="${imgUrl(p)}" alt=""></button><button type="button" class="x">✕</button>`;
      d.querySelector(".th").onclick=()=>lightbox(row.images.map(imgUrl),i,row.shop);
      d.querySelector(".x").onclick=async()=>{if(!confirm("ลบรูปนี้?"))return;try{const j=await api("rmimage",{id:row.id,path:p});row.images=j.row.images;patchRow(j.row);drawImgs()}catch(x){toast(x.message)}};
      box.appendChild(d)});
    e.queue.forEach((f,i)=>{const d=document.createElement("div");d.className="im q";d.innerHTML=`<div class="th"><img src="${f.url}" alt=""></div><button type="button" class="x">✕</button>`;d.querySelector(".x").onclick=()=>{e.queue.splice(i,1);drawImgs()};box.appendChild(d)});
  };
  drawImgs();
  const pick=async files=>{
    for(const f of files){
      if(!/^image\//.test(f.type)){toast("ไฟล์ไม่ใช่รูปภาพ");continue}
      try{const d=await shrink(f);
        if(!row.id){e.queue.push({data:d,url:d});drawImgs()}
        else{ov.querySelector("#imnote").textContent="กำลังอัปโหลด…";const j=await api("upload",{id:row.id,dataUrl:d});row.images=j.row.images;patchRow(j.row);ov.querySelector("#imnote").textContent="อัปโหลดแล้ว";drawImgs()}
      }catch(x){toast(x.message||"อัปโหลดไม่สำเร็จ");ov.querySelector("#imnote").textContent=""}
    }
  };
  /* screen capture / paste / drop */
  const scrBtn=ov.querySelector("#scr"),scrHint=ov.querySelector("#scrhint");
  const canCap=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)&&!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!canCap){scrBtn.disabled=true;scrBtn.style.opacity=".5";scrHint.textContent="แคปหน้าจอใช้ไม่ได้บนมือถือ (ใช้บนคอมพิวเตอร์) — บนมือถือให้แคปหน้าจอด้วยเครื่องแล้วกด “เลือกรูปจากเครื่อง”"}
  else scrHint.textContent="กด “แคปหน้าจอ” แล้วเลือกหน้าต่าง/แท็บที่ต้องการ";
  scrBtn.onclick=async()=>{
    if(!canCap)return;
    let st;
    try{st=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false})}
    catch(x){toast(x&&(x.name==="NotAllowedError"||x.name==="AbortError")?"ยกเลิกการแคปหน้าจอ หรือไม่ได้รับอนุญาต":"แคปหน้าจอไม่ได้: "+(x&&x.message||x));return}
    try{
      const v=document.createElement("video");v.muted=true;v.playsInline=true;v.srcObject=st;
      await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error("อ่านภาพจากหน้าจอไม่ได้"));setTimeout(()=>no(new Error("หมดเวลารอภาพจากหน้าจอ")),8000)});
      await v.play();
      for(let i=0;i<20&&!(v.videoWidth&&v.readyState>=2);i++)await new Promise(r=>setTimeout(r,100));
      await new Promise(r=>setTimeout(r,300));
      const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
      if(!c.width||!c.height)throw new Error("ไม่ได้ภาพจากหน้าจอ");
      c.getContext("2d").drawImage(v,0,0);
      const blob=await new Promise(ok=>c.toBlob(ok,"image/png"));
      if(!blob)throw new Error("แปลงภาพไม่ได้");
      st.getTracks().forEach(t=>t.stop());st=null;
      await pick([new File([blob],"screenshot.png",{type:"image/png"})]);
    }catch(x){toast(x.message||"แคปหน้าจอไม่สำเร็จ")}
    finally{if(st)st.getTracks().forEach(t=>t.stop())}
  };
  const imgFiles=dt=>{const out=[];if(!dt)return out;if(dt.items&&dt.items.length){for(const it of dt.items){if(it.kind==="file"&&/^image\//.test(it.type)){const f=it.getAsFile();if(f)out.push(f)}}}
    if(!out.length&&dt.files)for(const f of dt.files)if(/^image\//.test(f.type))out.push(f);return out};
  const onPaste=ev=>{const fs=imgFiles(ev.clipboardData);if(fs.length){ev.preventDefault();pick(fs)}};
  document.addEventListener("paste",onPaste);
  const dd=ov.querySelector(".sheet");
  ov.addEventListener("dragover",ev=>{ev.preventDefault();dd.style.outline="2px dashed var(--ac,#2a7)"});
  ov.addEventListener("dragleave",ev=>{if(ev.target===ov)dd.style.outline=""});
  ov.addEventListener("drop",ev=>{ev.preventDefault();dd.style.outline="";const fs=imgFiles(ev.dataTransfer);if(fs.length)pick(fs);else toast("ไม่พบไฟล์รูปภาพ")});
  ov.querySelector("#cam").onclick=()=>ov.querySelector("#fcam").click();
  ov.querySelector("#gal").onclick=()=>ov.querySelector("#fgal").click();
  ov.querySelector("#fcam").onchange=ev=>{pick([...ev.target.files]);ev.target.value=""};
  ov.querySelector("#fgal").onchange=ev=>{pick([...ev.target.files]);ev.target.value=""};
  ov.querySelector("#save").onclick=async()=>{
    const data={};for(const n of FIELDS){const x=get(n);data[n]=!x?(row[n]==null?"":row[n]):x.type==="checkbox"?x.checked:x.value.trim()}
    if(!data.shop&&!data.platform){toast("กรุณาใส่ชื่อร้านหรือแพลตฟอร์ม");return}
    if(data.pack_count===""||!(parseFloat(data.pack_count)>0))data.pack_count=1;
    if(data.link&&!/^https?:\/\//i.test(data.link)){toast("ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://");return}
    const b=ov.querySelector("#save");b.disabled=true;b.textContent="กำลังบันทึก…";
    try{
      if(row.id)data.id=row.id;
      let j=await api("save",{row:data});let saved=j.row;
      for(const f of e.queue){b.textContent="อัปโหลดรูป…";j=await api("upload",{id:saved.id,dataUrl:f.data});saved=j.row}
      patchRow(saved);close();render();toast("บันทึกแล้ว");
    }catch(x){b.disabled=false;b.textContent="บันทึก";toast(x.message)}
  };
}
function patchRow(r){const i=S.rows.findIndex(x=>x.id===r.id);if(i>=0)S.rows[i]=r;else S.rows.push(r)}
async function delRow(r){
  if(!confirm(`ลบแถวนี้?\n${r.shop} · ${r.diameter} · ${r.colour}\n(รูปที่แนบจะถูกลบด้วย)`))return;
  try{await api("delete",{id:r.id});S.rows=S.rows.filter(x=>x.id!==r.id);render();toast("ลบแล้ว")}catch(e){toast(e.message)}
}

/* ---------- image resize ---------- */
async function shrink(file,max=1600,q=.82){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("เปิดรูปไม่ได้ (รองรับ JPG/PNG/WebP)"));i.src=URL.createObjectURL(file)})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}

/* ---------- lightbox ---------- */
function lightbox(urls,i,cap){
  const d=document.createElement("div");d.className="lb";
  const show=()=>{d.innerHTML=`<img src="${urls[i]}" alt=""><button class="c">✕</button>${urls.length>1?'<button class="pv2">‹</button><button class="nx">›</button>':""}<div class="cap">${esc(cap||"")} ${urls.length>1?`(${i+1}/${urls.length})`:""}</div>`;
    d.querySelector(".c").onclick=close;const p=d.querySelector(".pv2"),n=d.querySelector(".nx");if(p){p.onclick=()=>{i=(i-1+urls.length)%urls.length;show()};n.onclick=()=>{i=(i+1)%urls.length;show()}}};
  const key=e=>{if(e.key==="Escape")close();if(e.key==="ArrowLeft"&&urls.length>1){i=(i-1+urls.length)%urls.length;show()}if(e.key==="ArrowRight"&&urls.length>1){i=(i+1)%urls.length;show()}};
  const close=()=>{d.remove();document.removeEventListener("keydown",key)};
  let x0=null;d.ontouchstart=e=>x0=e.touches[0].clientX;d.ontouchend=e=>{if(x0==null||urls.length<2)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){i=(i+(dx<0?1:-1)+urls.length)%urls.length;show()}x0=null};
  d.onclick=e=>{if(e.target===d||e.target.tagName==="IMG")close()};
  document.addEventListener("keydown",key);show();document.body.appendChild(d);
}

if(S.pass)load();else render();
